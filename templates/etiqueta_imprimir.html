{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial - {{ usuario.nombre }} {{ usuario.apellido }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .printable-tag {
            width: 10cm;
            height: 5cm;
            padding: 0.22in;
            box-sizing: border-box;
            background-color: #fff;
            border: 1px solid #ccc;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 18px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
        }

        .tag-logo {
            height: 1.35in;
            width: 1.35in;
            object-fit: contain;
            flex-shrink: 0;
        }

        .tag-info {
            flex-grow: 1;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
        }

        .tag-nombre {
            font-size: 19pt;
            font-weight: 700;
            margin: 0;
            line-height: 1.18;
            color: #111827;
            word-break: break-word;
            text-transform: capitalize !important;
        }

        @media print {
            @page {
                size: 10cm 5cm;
                margin: 0;
            }
            body {
                background-color: #fff;
                min-height: auto;
            }
            .printable-tag {
                box-shadow: none;
                border: none;
                margin: 0;
                width: 10cm;
                height: 5cm;
            }
        }
    </style>
</head>
<body>
    <div class="printable-tag">
        <img src="{% if plantilla.logo %}{{ plantilla.logo.url }}{% else %}{% static 'img/logo_etiqueta.jpg' %}{% endif %}" alt="Logo INACAP" class="tag-logo">
        <div class="tag-info">
            <h1 class="tag-nombre">{{ usuario.nombre|title }}<br>{{ usuario.apellido|title }}</h1>
        </div>
    </div>

    <script>
        window.onload = function() {
            window.print();
            window.onafterprint = function() {
                window.close();
            };
        };
    </script>
</body>
</html>
