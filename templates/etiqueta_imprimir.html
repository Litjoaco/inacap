{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Credencial - {{ usuario.nombre }} {{ usuario.apellido }}</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
            color-adjust: exact !important;
        }

        body {
            font-family: 'Poppins', Arial, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .printable-tag {
            width: 106mm;
            height: 62mm;
            padding: 5mm 8mm;
            box-sizing: border-box;
            background-color: #ffffff;
            border: 1px solid #ccc;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            gap: 16px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.08);
            overflow: hidden;
        }

        .tag-logo-svg {
            height: 25mm;
            width: 25mm;
            flex-shrink: 0;
            shape-rendering: crispEdges;
        }

        .tag-logo-img {
            height: 25mm;
            width: 25mm;
            max-height: 100%;
            object-fit: contain;
            flex-shrink: 0;
            image-rendering: -webkit-optimize-contrast;
            image-rendering: crisp-edges;
            image-rendering: pixelated;
        }

        .tag-info {
            flex-grow: 1;
            text-align: left;
            display: flex;
            flex-direction: column;
            justify-content: center;
            overflow: hidden;
            min-width: 0;
            max-width: calc(100% - 25mm - 16px);
        }

        .tag-nombre {
            font-size: 22pt;
            font-weight: 700;
            margin: 0;
            line-height: 1.2;
            color: #000000;
            white-space: nowrap;
            letter-spacing: -0.01em;
            text-transform: capitalize !important;
        }

        @media print {
            @page {
                size: 106mm 62mm landscape;
                margin: 0;
            }
            body {
                background-color: #ffffff;
                min-height: auto;
                margin: 0;
                padding: 0;
            }
            .printable-tag {
                box-shadow: none;
                border: none;
                border-radius: 0;
                margin: 0;
                width: 106mm;
                height: 62mm;
                background-color: #ffffff;
                padding: 5mm 8mm;
            }
        }
    </style>
</head>
<body>
    <div class="printable-tag">
        {% if plantilla.logo %}
            <img src="{{ plantilla.logo.url }}" alt="Logo" class="tag-logo-img">
        {% else %}
            <svg class="tag-logo-svg" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" shape-rendering="crispEdges">
                <!-- Logo INACAP Vectorial Puro: Rojo puro #FF0000 sin suavizado ni artefactos de compresión -->
                <path d="M 0,0 L 100,0 L 100,100 L 83.33,100 L 83.33,36.5 L 66.67,36.5 L 66.67,100 L 0,100 Z" fill="#FF0000" />
            </svg>
        {% endif %}
        <div class="tag-info">
            <h1 class="tag-nombre">{{ usuario.nombre|title }} {{ usuario.apellido|title }}</h1>
        </div>
    </div>

    <script>
        function ajustarTamanoNombre() {
            const el = document.querySelector('.tag-nombre');
            const container = document.querySelector('.tag-info');
            if (!el || !container) return;
            
            let size = 22;
            el.style.fontSize = size + 'pt';
            
            // Reducir hasta que el texto quepa en una sola línea en el contenedor
            while (el.scrollWidth > container.clientWidth && size > 13) {
                size -= 0.5;
                el.style.fontSize = size + 'pt';
            }
            
            // Si el nombre aún excede después del mínimo, permitir salto de línea limpio
            if (el.scrollWidth > container.clientWidth) {
                el.style.whiteSpace = 'normal';
                el.style.lineHeight = '1.15';
            }
        }

        function iniciarImpresion() {
            ajustarTamanoNombre();
            setTimeout(function() {
                window.print();
            }, 200);
        }

        if (document.fonts && document.fonts.ready) {
            document.fonts.ready.then(iniciarImpresion);
        } else {
            window.onload = iniciarImpresion;
        }

        window.onafterprint = function() {
            window.close();
        };
    </script>
</body>
</html>
