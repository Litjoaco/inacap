{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada (404) - INACAP</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Poppins:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/responsive-mobile.css' %}">
    <style>
        :root {
            --inacap-red: #B70420;
            --inacap-dark: #8B0014;
        }
        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background-color: #F8FAFC;
            color: #1E293B;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .top-navbar {
            background: linear-gradient(to right, #B70420, #8B0014);
            padding: 12px 0;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .error-card {
            background: white;
            border-radius: 18px;
            padding: 45px 30px;
            max-width: 540px;
            margin: auto;
            border: 1px solid #E2E8F0;
            box-shadow: 0 10px 30px rgba(0,0,0,0.06);
            text-align: center;
        }
        .error-code {
            font-family: 'Poppins', sans-serif;
            font-size: 5rem;
            font-weight: 800;
            color: var(--inacap-red);
            line-height: 1;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <header class="top-navbar">
        <div class="container d-flex align-items-center justify-content-between">
            <a href="{% url 'inicio' %}" class="d-flex align-items-center text-white text-decoration-none">
                <img src="{% static 'img/Logo_60anos.png' %}" alt="INACAP" height="38" class="me-2">
                <span class="fw-bold fs-5 mb-0">INACAP</span>
            </a>
            <a href="{% url 'inicio' %}" class="btn btn-outline-light btn-sm rounded-pill px-3">
                <i class="bi bi-house-door-fill me-1"></i> Inicio
            </a>
        </div>
    </header>

    <main class="container my-auto py-5">
        <div class="error-card">
            <div class="error-code">404</div>
            <h3 class="fw-bold text-dark mb-2">Página no encontrada</h3>
            <p class="text-muted mb-4">
                La dirección o enlace al que intentas acceder no existe, fue modificado o ya no está disponible en la plataforma.
            </p>
            <div class="d-flex justify-content-center gap-2 flex-wrap">
                <a href="{% url 'inicio' %}" class="btn btn-danger px-4 py-2 fw-semibold rounded-pill" style="background: var(--inacap-red);">
                    <i class="bi bi-house-door-fill me-1"></i> Volver al Inicio
                </a>
                <a href="{% url 'landing_reuniones' %}" class="btn btn-outline-secondary px-4 py-2 fw-semibold rounded-pill">
                    <i class="bi bi-calendar-event me-1"></i> Ver Eventos
                </a>
            </div>
        </div>
    </main>

    <footer class="inacap-footer-simple">
        <div class="container text-center text-white-50 small">
            &copy; 2026 INACAP. Todos los derechos reservados.
        </div>
    </footer>
</body>
</html>
